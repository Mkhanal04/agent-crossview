<script>
/* Which numbers to show. Your own (data.js and progress.js, made on this Mac and never committed), or the demo
   company with ?demo (demo-data.js, all made up). If your own aren't here, as in a fresh copy of the project,
   the demo loads instead. Nothing is fetched from anywhere else. */
(function () {
  var demo = /[?&]demo(=1)?(&|$)/.test(location.search);
  document.write(demo ? '<script src="demo-data.js"><\/script>' : '<script src="data.js"><\/script><script src="progress.js"><\/script>');
})();
</script>
<script>if (!window.GB) document.write('<script src="demo-data.js"><\/script>');</script>
